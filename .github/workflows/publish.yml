name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to release if triggering manually (e.g. v0.1.2)'
        required: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Pre-Release Test Verification
    runs-on: ubuntu-latest
    if: github.repository == 'adrijshikhar/actr'
    outputs:
      tag: ${{ steps.target.outputs.ref }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - name: Determine Target Git Ref
        id: target
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          VERSION="${TAG#v}"
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Formatting
        run: |
          test -z "$(gofmt -l .)" || { echo "Unformatted Go code found:"; gofmt -l .; exit 1; }

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests (Race Detector)
        run: go test -v -race ./...

      - name: Run Integration Smoke Tests
        run: go test -v -run TestBinaryBuildAndSmoke ./test/...

  goreleaser:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    needs: test-and-verify
    if: github.repository == 'adrijshikhar/actr'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.target.outputs.ref }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - name: Determine Target Git Ref
        id: target
        env:
          VERIFY_TAG: ${{ needs.test-and-verify.outputs.tag }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$VERIFY_TAG" ]; then
            TAG="$VERIFY_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          VERSION="${TAG#v}"
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  verify-asset:
    name: Verify Release Assets & Smoke Test
    needs: goreleaser
    runs-on: macos-latest
    if: github.repository == 'adrijshikhar/actr'
    steps:
      - name: Download & Verify Release Checksums
        id: checksum
        env:
          TAG: ${{ needs.goreleaser.outputs.tag }}
          VERSION: ${{ needs.goreleaser.outputs.version }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          BASE_URL="https://github.com/${GITHUB_REPO}/releases/download/${TAG}"
          CHECKSUMS_URL="${BASE_URL}/checksums.txt"

          echo "Downloading checksums.txt from $CHECKSUMS_URL"
          curl -fSL -o checksums.txt "$CHECKSUMS_URL"

          PLATFORMS=("darwin_arm64" "darwin_amd64" "linux_arm64" "linux_amd64")
          for PLATFORM in "${PLATFORMS[@]}"; do
            ARCHIVE="actr_${VERSION}_${PLATFORM}.tar.gz"
            echo "Downloading and verifying $ARCHIVE..."
            curl -fSL -o "$ARCHIVE" "${BASE_URL}/${ARCHIVE}"

            COMPUTED_SHA=$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')
            EXPECTED_SHA=$(grep "$ARCHIVE" checksums.txt | awk '{print $1}')

            if [ -z "$EXPECTED_SHA" ]; then
              echo "Error: No checksum found in checksums.txt for $ARCHIVE" >&2
              exit 1
            fi

            if [ "$COMPUTED_SHA" != "$EXPECTED_SHA" ]; then
              echo "Error: Checksum mismatch for $ARCHIVE!" >&2
              echo "  Computed: $COMPUTED_SHA" >&2
              echo "  Expected: $EXPECTED_SHA" >&2
              exit 1
            fi

            echo "✓ Verified $ARCHIVE ($COMPUTED_SHA)"
          done

      - name: Run Binary Smoke Test Probe
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: |
          RUNNER_ARCH="$(uname -m)"
          if [ "$RUNNER_ARCH" = "arm64" ]; then
            tar -xzf "actr_${VERSION}_darwin_arm64.tar.gz" actr
          else
            tar -xzf "actr_${VERSION}_darwin_amd64.tar.gz" actr
          fi

          chmod +x ./actr
          PROBE_VERSION=$(./actr -v)
          echo "Probe version output: $PROBE_VERSION"

          if [[ "$PROBE_VERSION" != *"actr version ${VERSION}"* ]]; then
            echo "Error: Pre-flight smoke test failed. Expected version ${VERSION}, got: $PROBE_VERSION" >&2
            exit 1
          fi
          echo "✓ Binary probe verification PASSED: $PROBE_VERSION"

  homebrew:
    name: Trigger Homebrew Tap Update
    needs: [goreleaser, verify-asset]
    if: github.repository == 'adrijshikhar/actr'
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ needs.goreleaser.outputs.tag }}
    secrets: inherit
